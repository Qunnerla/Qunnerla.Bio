<!DOCTYPE html>
<html lang="th">
<head>

    <title>QUNNERLA - Bio</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script>
        document.addEventListener('error', (event) => {
            const img = event.target;
            if (img instanceof HTMLImageElement && img.dataset.localSrc) {
                img.src = img.dataset.localSrc;
                img.removeAttribute('data-local-src');
            }
        }, true);
    </script>
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }

        :root {
            --bg-color: #0d0d0d;
            --text-color: #ffffff;
            --desc-color: #888888;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-text: #ffffff;
            --btn-border: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.15);
            --profile-border: #333;
        }

        body.light-mode {
            --bg-color: #f2f2f2;
            --text-color: #1a1a1a;
            --desc-color: #666666;
            --btn-bg: #ffffff;
            --btn-text: #333333;
            --btn-border: #e0e0e0;
            --btn-hover: #f9f9f9;
            --profile-border: #e0e0e0;
        }

        html, body {
            margin: 0; padding: 0;
            min-height: 100vh;
            width: 100vw; 
            max-width: 100%; 
            overflow-x: hidden; 
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        /* =========================================
           ✨ อนิเมชันเปิดตัว
           ========================================= */
        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popInFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .theme-toggle {
            position: absolute; top: 20px; left: 20px;
            width: 45px; height: 45px;
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            border-radius: 50%; font-size: 20px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 100;
            opacity: 0; animation: slideDownFade 0.5s ease 0.3s forwards;
        }


        /* =========================================
           🟢 แถบสถานะรับงาน (สีสั่งได้จากหลังบ้าน)
           ========================================= */
        .status-pill {
            --pill-color: #00d26a;
            --pill-dot: #00d26a;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px; margin-top: 2px; margin-bottom: 4px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.2px;
            color: var(--pill-color);
            background: color-mix(in srgb, var(--pill-color) 8%, transparent);
            border: 1px solid color-mix(in srgb, var(--pill-color) 28%, transparent);
            border-radius: 30px;
            opacity: 0; animation: slideDownFade 0.5s ease 0.25s forwards;
        }
        body.light-mode .status-pill {
            color: color-mix(in srgb, var(--pill-color) 72%, #000);
            background: color-mix(in srgb, var(--pill-color) 7%, transparent);
            border-color: color-mix(in srgb, var(--pill-color) 38%, #000 10%);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
            background: var(--pill-dot);
            animation: statusPulse 2.2s ease-out infinite;
        }
        @keyframes statusPulse {
            0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pill-dot) 55%, transparent); }
            70%  { box-shadow: 0 0 0 9px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }
        @media (prefers-reduced-motion: reduce) {
            .status-dot { animation: none; }
        }

        .profile-section {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            padding-top: 60px; z-index: 10;
        }
        .profile-pic {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--profile-border); margin-bottom: 15px; background-color: #222; 
            opacity: 0; animation: slideDownFade 0.5s ease 0s forwards;
        }
        h1 { 
            margin: 0; font-size: 24px; letter-spacing: 2px; 
            opacity: 0; animation: slideDownFade 0.5s ease 0.1s forwards;
        }
        p.bio-desc {
            color: var(--desc-color); font-size: 14px; text-align: center;
            margin-top: 5px; margin-bottom: 10px; line-height: 1.5;
            opacity: 0; animation: slideDownFade 0.5s ease 0.2s forwards;
        }

        /* =========================================
           🃏 โครงสร้างการ์ด (Optimized)
           ========================================= */
        .swiper-container-wrapper {
            width: 100%; max-width: 1200px; margin-top: 10px; padding-bottom: 20px; overflow: visible;
            opacity: 0; animation: popInFade 0.6s ease 0.4s forwards;
        }

        .swiper { width: 100%; padding: 70px 0 60px 0; overflow: visible; }

        .swiper-slide {
            width: 300px; height: 450px; 
            background: transparent !important; 
            overflow: visible !important; 
            z-index: 1;
            transform: translateZ(0); 
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .swiper-slide-active { z-index: 5 !important; }

        /* =========================================
           🌟 ระบบป้ายยศ (ลดแสง ลดฟุ้ง ไม่ดับ)
           ========================================= */
        .rank-badge-wrapper {
            position: absolute; top: -65px; left: 50%; width: 60px; height: 60px;
            margin-left: -30px; z-index: 100;
            transform: translateY(30px) scale(0.5); 
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1.2), opacity 0.5s ease;
            opacity: 0; pointer-events: none;
        }
        .swiper-slide-active .rank-badge-wrapper {
            opacity: 1; transform: translateY(0) scale(1.1); 
        }
        .swiper-slide .rank-badge-wrapper {
            display: none;
        }

        /* 💡 แก้ไขแสง: ลดความฟุ้งกระจายลง (จาก 35px เหลือ 20px) */
        .rank-glow-bg {
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
            transform: translate(-50%, -50%); border-radius: 50%;
            background: var(--rank-glow);
            box-shadow: 0 0 20px 8px var(--rank-glow); 
            opacity: 0; transition: opacity 0.8s ease;
            z-index: 1;
        }
        /* 💡 แก้ไขแสง: ลดความสว่างสดลงเหลือ 0.45 และติดค้างไว้ไม่ดับ */
        .swiper-slide-active .rank-glow-bg {
            opacity: 0.45; 
        }

        .rank-badge {
            width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2;
        }

        /* กำหนดสีแสง */
        .rank-gold { --rank-glow: #ffd700; }
        .rank-red { --rank-glow: #ff3232; }
        .rank-blue { --rank-glow: #3296ff; }
        .rank-green { --rank-glow: #32ff32; }
        .rank-purple { --rank-glow: #b432ff; }
        .rank-silver { --rank-glow: #e6e6e6; }

        /* =========================================
           🖼️ เลเยอร์ตัวการ์ด (แก้ขอบดำบิ่นและเส้นจาง)
           ========================================= */
        .card-inner {
            width: 100%; height: 100%; border-radius: 20px;
            position: relative; overflow: hidden; 
            /* 💡 เอา background-color: #1a1a1a; ออก เพื่อแก้ภาพบิ่นเห็นพื้นดำ */
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); /* 💡 ลดความเข้มของเงาขอบการ์ดลง */
            transition: transform 0.4s ease;
            /* 💡 บังคับให้เบราว์เซอร์ตัดขอบโค้งเนียนๆ ไม่ให้เส้นสีโผล่ */
            isolation: isolate; 
        }
        .swiper-slide-active .card-inner { 
            transform: translateY(-25px); 
        }

        /* 💡 ลดความมืดของไพ่ด้านหลังลง เพื่อไม่ให้ดูเป็นเส้นขอบดำ (จาก 0.6 เป็น 0.4) */
        .card-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); z-index: 2;
            transition: opacity 0.4s ease; pointer-events: none;
        }
        .swiper-slide-active .card-overlay { opacity: 0; } 

        /* ขอบไฮไลท์บางๆ */
        .card-inner::after {
            content: ''; position: absolute; inset: 0;
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%);
            z-index: 10; pointer-events: none;
        }

        .image-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: transparent; font-size: 0;
            display: block; object-fit: cover; object-position: center center; 
            /* 💡 ขยายภาพขึ้นอีกนิดนึง (1.03) ให้ทับขอบมนมิดชิดพอดี */
            transform: scale(1.03); 
            z-index: 1;
        }

        .card-gradient {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95)); z-index: 3;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .swiper-slide-active .card-gradient { opacity: 1; }

        /* =========================================
           📝 รายละเอียดและชื่อผลงาน
           ========================================= */
        .card-details {
            position: absolute; left: 15px; right: 15px; bottom: -50px; 
            z-index: 4; text-align: left; opacity: 0; transition: all 0.4s ease; pointer-events: none; color: #fff; 
        }
        .swiper-slide-active .card-details { bottom: 20px; opacity: 1; }
        .card-details h3 { margin: 0 0 5px 0; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        .card-details p { margin: 0; font-size: 11px; color: #ddd; line-height: 1.5; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); }

        .collection-badge {
            display: inline-block; padding: 4px 30px 4px 8px; margin-bottom: 8px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            border-radius: 0 4px 4px 0; color: #fff; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }
        .badge-new { background: linear-gradient(90deg, rgba(255, 180, 0, 0.85) 0%, rgba(255, 180, 0, 0) 100%); border-left: 3px solid #FFD700; }

        /* =========================================
           📱 การตั้งค่ารองรับหน้าจอ
           ========================================= */
        @media (max-width: 1024px) {
            .swiper-slide { width: 280px; height: 420px; }
            h1 { font-size: 22px; }
        }
        @media (max-width: 768px) {
            .swiper-slide { width: 250px; height: 375px; } 
            .profile-pic { width: 90px; height: 90px; }
            h1 { font-size: 20px; }
            .card-details h3 { font-size: 16px; }
            .card-details p { font-size: 10px; }
            .collection-badge { padding: 3px 20px 3px 6px; font-size: 9px; margin-bottom: 6px; }
            .swiper-slide-active .card-details { bottom: 15px; }
            .rank-badge-wrapper { top: -50px; width: 55px; height: 55px; margin-left: -27.5px; } 
            .links-container { padding: 0 20px 50px 20px !important; }
        }

        /* =========================================
           🔗 กล่องปุ่มลิงก์โซเชียล
           ========================================= */
        .links-container {
            width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px;
            padding: 0 20px 60px 20px; margin: 0 auto; z-index: 10; 
        }
        .link-btn {
            display: flex; align-items: center; justify-content: center; position: relative;
            width: 100%; background: var(--btn-bg); color: var(--btn-text);
            text-decoration: none; padding: 16px 20px; border-radius: 30px;
            font-size: 15px; font-weight: 600; border: 1px solid var(--btn-border);
            opacity: 0; animation: slideUpFade 0.5s ease forwards;
        }
        .link-btn:nth-child(1) { animation-delay: 0.5s; }
        .link-btn:nth-child(2) { animation-delay: 0.6s; }
        .link-btn:nth-child(3) { animation-delay: 0.7s; }
        .link-btn:nth-child(4) { animation-delay: 0.8s; }
        .link-btn:nth-child(5) { animation-delay: 0.9s; }
        .link-btn:nth-child(6) { animation-delay: 1.0s; }
        .link-btn:nth-child(7) { animation-delay: 1.1s; }
        .link-btn:nth-child(8) { animation-delay: 1.2s; }

        .link-btn { transition: background-color 0.3s ease, transform 0.2s ease; }
        .link-btn:active { background: var(--btn-hover); transform: scale(0.98); }
        .link-btn .icon { position: absolute; left: 20px; font-size: 22px; }
        .link-btn .btn-icon { position: absolute; left: 20px; width: 24px; height: 24px; object-fit: contain; border-radius: 4px; }
        .link-btn.line-btn { color: #00c300; background: rgba(0, 195, 0, 0.05); border-color: rgba(0, 195, 0, 0.2); }
        body.light-mode .link-btn.line-btn { background: #ffffff; border-color: #00c300; }

        /* =========================================
           🔧 หลังบ้าน (กดโลโก้ 5 ครั้ง)
           ========================================= */
        .admin-overlay {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            background: rgba(0, 0, 0, 0.65);
            -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        }
        .admin-overlay[hidden] { display: none; }
        .admin-box {
            width: 100%; max-width: 360px; max-height: 88vh; overflow-y: auto;
            position: relative; padding: 22px 20px;
            background: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--btn-border); border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .admin-box h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: 0.5px; }
        .admin-close {
            position: absolute; top: 12px; right: 12px;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            color: var(--text-color); font-size: 14px; font-family: inherit;
        }
        .admin-box input[type="email"],
        .admin-box input[type="password"],
        .admin-box input[type="text"] {
            width: 100%; padding: 11px 14px; margin-top: 5px; margin-bottom: 12px;
            background: var(--btn-bg); color: var(--text-color);
            border: 1px solid var(--btn-border); border-radius: 10px;
            font-size: 14px; font-family: inherit;
        }
        .admin-btn {
            width: 100%; padding: 12px; margin-top: 8px; border-radius: 24px; cursor: pointer;
            font-size: 14px; font-weight: 600; font-family: inherit;
            background: var(--btn-bg); color: var(--text-color);
            border: 1px solid var(--btn-border);
        }
        .admin-btn.primary { background: #00d26a; border-color: #00d26a; color: #06231a; }
        .admin-btn:active { transform: scale(0.98); }
        .admin-msg { font-size: 12.5px; margin: 10px 0 0; min-height: 16px; color: var(--desc-color); }
        .admin-msg.err { color: #ff6b6b; }
        .admin-msg.ok { color: #00d26a; }

        .adm-preview { display: flex; justify-content: center; padding: 16px 0 18px; }
        .adm-preview .status-pill { opacity: 1; animation: none; margin: 0; }

        .adm-switch-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 12px 14px; margin-bottom: 6px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border); border-radius: 12px;
        }
        .adm-switch-label { font-size: 14px; font-weight: 600; }
        .adm-switch {
            width: 52px; height: 30px; flex-shrink: 0; padding: 0; position: relative;
            border: none; border-radius: 15px; cursor: pointer;
            background: #6b6b6b; transition: background 0.25s ease;
        }
        .adm-switch[aria-checked="true"] { background: #00d26a; }
        .adm-switch-knob {
            position: absolute; top: 3px; left: 3px;
            width: 24px; height: 24px; border-radius: 50%;
            background: #fff; transition: transform 0.25s ease;
        }
        .adm-switch[aria-checked="true"] .adm-switch-knob { transform: translateX(22px); }
        .adm-hint { font-size: 12px; line-height: 1.5; color: var(--desc-color); margin: 0 0 16px; padding: 0 2px; }

        .adm-field { display: block; font-size: 12px; color: var(--desc-color); margin-bottom: 4px; }
        .adm-colors { display: flex; gap: 10px; }
        .adm-colors .adm-field { flex: 1; }
        .adm-field input[type="color"] {
            width: 100%; height: 34px; margin-top: 5px; padding: 2px; cursor: pointer;
            background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 8px;
        }

    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script>
        const slideElements = document.querySelectorAll('.swiper-slide');
        const totalSlides = slideElements.length;

        const swiper = new Swiper(".mySwiper", {
            effect: "creative",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            
            initialSlide: totalSlides - 1, 
            
            slideToClickedSlide: true,
            creativeEffect: {
                limitProgress: 2, 
                prev: { translate: ["-60%", "10%", -250], rotate: [0, 0, -5], origin: "bottom center" },
                next: { translate: ["60%", "10%", -250], rotate: [0, 0, 5], origin: "bottom center" },
            },
            keyboard: { enabled: true },
            
            autoplay: {
                delay: 1800, 
                disableOnInteraction: false, 
            }
        });

        // 🛑 หยุดรออนิเมชันเปิดเว็บ
        swiper.autoplay.stop();

        setTimeout(() => {
            swiper.slideTo(0, 2000); 

            swiper.once('slideChangeTransitionEnd', () => {
                if(swiper.activeIndex === 0) {
                    swiper.autoplay.start();
                }
            });
        }, 1000); 

        // ระบบปุ่มเปลี่ยนโหมดสี
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'light') {
            body.classList.add('light-mode');
            themeBtn.innerText = '🌙'; 
        }
        themeBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode'); 
            if (body.classList.contains('light-mode')) {
                themeBtn.innerText = '🌙'; 
                localStorage.setItem('theme', 'light'); 
            } else {
                themeBtn.innerText = '☀️'; 
                localStorage.setItem('theme', 'dark'); 
            }
        });
    </script>

    <div class="admin-overlay" id="adminOverlay" hidden role="dialog" aria-modal="true" aria-label="ตั้งค่าสถานะรับงาน">
        <div class="admin-box">
            <button class="admin-close" id="admClose" aria-label="ปิด">&#10005;</button>

            <div id="admLoginView">
                <h2>เข้าสู่ระบบ</h2>
                <p class="adm-hint">ใช้อีเมลและรหัสผ่านของบัญชี Supabase</p>
                <input type="email" id="admEmail" placeholder="อีเมล" autocomplete="username">
                <input type="password" id="admPass" placeholder="รหัสผ่าน" autocomplete="current-password">
                <button class="admin-btn primary" id="admLoginBtn">เข้าสู่ระบบ</button>
                <p class="admin-msg" id="admLoginMsg"></p>
            </div>

            <div id="admPanelView" hidden>
                <h2>สถานะรับงาน</h2>

                <div class="adm-preview">
                    <div class="status-pill" id="admPreviewPill"><span class="status-dot"></span><span class="status-label"></span></div>
                </div>

                <div class="adm-switch-row">
                    <span class="adm-switch-label" id="admSwitchText">เปิดรับงาน</span>
                    <button type="button" class="adm-switch" id="admSwitch" role="switch" aria-checked="true" aria-label="สลับเปิดปิดรับงาน">
                        <span class="adm-switch-knob"></span>
                    </button>
                </div>
                <p class="adm-hint" id="admHint"></p>

                <label class="adm-field">ข้อความ<input type="text" id="fLabel" maxlength="60"></label>
                <div class="adm-colors">
                    <label class="adm-field">สีแถบ<input type="color" id="fColor"></label>
                    <label class="adm-field">สีจุดกะพริบ<input type="color" id="fDot"></label>
                </div>

                <button class="admin-btn primary" id="admSave">บันทึก</button>
                <button class="admin-btn" id="admLogout">ออกจากระบบ</button>
                <p class="admin-msg" id="admMsg"></p>
            </div>
        </div>
    </div>

    <script>
    /* =========================================================
       ระบบสถานะรับงาน + หลังบ้าน (Supabase)
       ========================================================= */
    (function () {

        /* ⚙️ วาง anon public key จาก Supabase ลงในบรรทัดล่างนี้
           หาได้ที่ Supabase -> Project Settings -> API -> anon public
           ถ้าเว้นว่างไว้ แถบสถานะจะใช้ค่าที่เขียนไว้ใน HTML ตามปกติ */
        var SB_URL = 'https://esvaazkbtmjxiqwycsze.supabase.co';
        var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzdmFhemtidG1qeGlxd3ljc3plIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTY4ODIsImV4cCI6MjA5ODM5Mjg4Mn0.EWARhQYuOsctEgEdoUDtSmqEhuc5N2hpuAbCcbmG63A';

        var DEFAULTS = {
            is_open: true,
            open_label: 'เปิดรับงาน · ทักมาคุยได้เลย',
            open_color: '#00d26a',
            open_dot: '#00d26a',
            closed_label: 'คิวเต็มชั่วคราว',
            closed_color: '#9aa0a6',
            closed_dot: '#9aa0a6'
        };

        var state = Object.assign({}, DEFAULTS);
        var draft = null;
        var $ = function (id) { return document.getElementById(id); };

        function paint(pill, s) {
            if (!pill) return;
            var open = !!s.is_open;
            pill.style.setProperty('--pill-color', open ? s.open_color : s.closed_color);
            pill.style.setProperty('--pill-dot', open ? s.open_dot : s.closed_dot);
            pill.querySelector('.status-label').textContent = open ? s.open_label : s.closed_label;
        }

        function msg(el, text, kind) {
            el.textContent = text || '';
            el.className = 'admin-msg' + (kind ? ' ' + kind : '');
        }

        /* ---------- ฝั่งคนเข้าดู ---------- */
        var loaded = false;
        function loadStatus() {
            if (!SB_KEY) return Promise.resolve();
            return fetch(SB_URL + '/rest/v1/site_status?id=eq.1&select=*', {
                headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
            }).then(function (r) {
                return r.ok ? r.json() : null;
            }).then(function (rows) {
                if (rows && rows[0]) {
                    state = Object.assign({}, DEFAULTS, rows[0]);
                    paint($('statusPill'), state);
                    loaded = true;
                }
            }).catch(function () { /* ต่อไม่ได้ก็ใช้ค่าเดิมใน HTML */ });
        }
        loadStatus();

        /* ---------- โหลด supabase-js เฉพาะตอนเปิดหลังบ้าน ---------- */
        var sbPromise = null;
        function getSb() {
            if (!sbPromise) {
                sbPromise = new Promise(function (resolve, reject) {
                    var s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                    s.onload = function () { resolve(window.supabase.createClient(SB_URL, SB_KEY)); };
                    s.onerror = function () { reject(new Error('โหลดไลบรารี Supabase ไม่สำเร็จ')); };
                    document.head.appendChild(s);
                });
            }
            return sbPromise;
        }

        /* ---------- กดโลโก้ 5 ครั้ง ---------- */
        var taps = 0, tapTimer = null;
        var pic = document.querySelector('.profile-pic');
        if (pic) {
            pic.addEventListener('click', function () {
                taps++;
                clearTimeout(tapTimer);
                tapTimer = setTimeout(function () { taps = 0; }, 1200);
                if (taps >= 5) { taps = 0; openAdmin(); }
            });
        }

        var overlay = $('adminOverlay');
        var loginView = $('admLoginView');
        var panelView = $('admPanelView');

        function openAdmin() {
            overlay.hidden = false;
            if (!SB_KEY) {
                loginView.hidden = false; panelView.hidden = true;
                msg($('admLoginMsg'), 'ยังไม่ได้ใส่ anon key ในไฟล์ index.html', 'err');
                return;
            }
            Promise.all([getSb(), loaded ? null : loadStatus()]).then(function (res) {
                return res[0].auth.getSession();
            }).then(function (r) {
                if (r && r.data && r.data.session) { showPanel(); }
                else { loginView.hidden = false; panelView.hidden = true; $('admEmail').focus(); }
            }).catch(function (e) { msg($('admLoginMsg'), e.message, 'err'); });
        }

        function closeAdmin() { overlay.hidden = true; }

        $('admClose').addEventListener('click', closeAdmin);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeAdmin(); });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !overlay.hidden) closeAdmin();
        });

        /* ---------- ล็อกอิน ---------- */
        $('admLoginBtn').addEventListener('click', function () {
            var email = $('admEmail').value.trim();
            var pass = $('admPass').value;
            if (!email || !pass) { msg($('admLoginMsg'), 'กรอกอีเมลและรหัสผ่านให้ครบ', 'err'); return; }
            msg($('admLoginMsg'), 'กำลังเข้าสู่ระบบ…');
            getSb().then(function (sb) {
                return sb.auth.signInWithPassword({ email: email, password: pass });
            }).then(function (r) {
                if (r.error) { msg($('admLoginMsg'), 'เข้าสู่ระบบไม่สำเร็จ: ' + r.error.message, 'err'); return; }
                $('admPass').value = '';
                msg($('admLoginMsg'), '');
                showPanel();
            }).catch(function (e) { msg($('admLoginMsg'), e.message, 'err'); });
        });

        $('admPass').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') $('admLoginBtn').click();
        });

        /* ---------- แผงตั้งค่า: หน้าเดียว แก้เฉพาะสถานะที่เลือกอยู่ ---------- */
        function keys() {
            return draft.is_open
                ? ['open_label', 'open_color', 'open_dot']
                : ['closed_label', 'closed_color', 'closed_dot'];
        }

        function fillFields() {
            var k = keys();
            $('fLabel').value = draft[k[0]];
            $('fColor').value = draft[k[1]];
            $('fDot').value = draft[k[2]];
            $('admSwitch').setAttribute('aria-checked', draft.is_open ? 'true' : 'false');
            $('admSwitchText').textContent = draft.is_open ? 'เปิดรับงาน' : 'ปิดรับงาน';
            $('admHint').textContent = draft.is_open
                ? 'ตอนนี้ตั้งเป็นเปิดรับงาน — ช่องข้างล่างคือหน้าตาของแถบตอนเปิด'
                : 'ตอนนี้ตั้งเป็นปิดรับงาน — ช่องข้างล่างคือหน้าตาของแถบตอนปิด';
            paint($('admPreviewPill'), draft);
        }

        function readFields() {
            if (!draft) return;
            var k = keys();
            draft[k[0]] = $('fLabel').value;
            draft[k[1]] = $('fColor').value;
            draft[k[2]] = $('fDot').value;
            paint($('admPreviewPill'), draft);
        }

        function showPanel() {
            loginView.hidden = true; panelView.hidden = false;
            draft = Object.assign({}, state);
            fillFields();
            msg($('admMsg'), '');
        }

        ['fLabel', 'fColor', 'fDot'].forEach(function (id) {
            $(id).addEventListener('input', readFields);
        });

        $('admSwitch').addEventListener('click', function () {
            if (!draft) return;
            draft.is_open = !draft.is_open;
            fillFields();
        });

        $('admSave').addEventListener('click', function () {
            if (!draft) return;
            msg($('admMsg'), 'กำลังบันทึก…');
            getSb().then(function (sb) {
                return sb.from('site_status').update({
                    is_open: draft.is_open,
                    open_label: draft.open_label,
                    open_color: draft.open_color,
                    open_dot: draft.open_dot,
                    closed_label: draft.closed_label,
                    closed_color: draft.closed_color,
                    closed_dot: draft.closed_dot
                }).eq('id', 1).select();
            }).then(function (r) {
                if (r.error) { msg($('admMsg'), 'บันทึกไม่สำเร็จ: ' + r.error.message, 'err'); return; }
                if (!r.data || !r.data.length) {
                    msg($('admMsg'), 'บันทึกไม่ผ่าน — บัญชีนี้ไม่มีสิทธิ์แก้ (เช็คอีเมลใน RLS policy)', 'err');
                    return;
                }
                state = Object.assign({}, draft);
                paint($('statusPill'), state);
                msg($('admMsg'), 'บันทึกแล้ว', 'ok');
            }).catch(function (e) { msg($('admMsg'), e.message, 'err'); });
        });

        $('admLogout').addEventListener('click', function () {
            getSb().then(function (sb) { return sb.auth.signOut(); })
                .catch(function () {})
                .then(function () {
                    panelView.hidden = true; loginView.hidden = false;
                    msg($('admMsg'), '');
                    msg($('admLoginMsg'), 'ออกจากระบบแล้ว');
                });
        });

    })();
    </script>
